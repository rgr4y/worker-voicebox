name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clear space to remove unused folders
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set environment variables
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "RELEASE_VERSION=${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE=dx4100/${{ github.event.repository.name }}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/bake-action@v2
        with:
          push: true
          set: |
            voicebox.tags=${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
            voicebox.tags=${{ env.IMAGE }}:latest
            voicebox.platform=linux/amd64
            *.args.RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            *.args.SERVERLESS=1

      - name: Build Summary
        run: |
          echo "Build completed"
          echo "Version: ${{ env.RELEASE_VERSION }}"
          echo "Image: ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}"
